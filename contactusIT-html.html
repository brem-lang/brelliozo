<!DOCTYPE html><html lang="it"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><style rel="stylesheet" type="text/css">@charset "utf-8";

html, body { font-family: Arial, Helvetica, sans-serif; padding-top: 60px; padding-bottom: 60px; color: rgb(51, 51, 51); margin: 0px; background-color: rgb(244, 244, 244) !important; }

.content-card { background-color: rgb(255, 255, 255); border-radius: 8px; border-top: 5px solid rgb(225, 0, 25); box-shadow: rgba(0, 0, 0, 0.08) 0px 10px 30px; padding: 50px; margin-bottom: 40px; }

h1 { font-size: 2.2rem; font-weight: 800; color: rgb(26, 26, 26); margin-bottom: 10px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }

p.subtitle { text-align: center; color: rgb(71, 85, 105); margin-bottom: 35px; font-size: 1.05rem; padding-bottom: 20px; border-bottom: 2px solid rgb(226, 232, 240); }

.form-label { font-weight: 700; color: rgb(26, 26, 26); margin-top: 20px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.3px; }

.form-control, .form-select { border-radius: 4px; padding: 14px 15px; border: 1px solid rgb(204, 204, 204); background-color: rgb(252, 252, 252); transition: 0.2s; font-size: 16px; }

.form-control:focus, .form-select:focus { background-color: rgb(255, 255, 255); border-color: rgb(225, 0, 25); box-shadow: rgba(225, 0, 25, 0.15) 0px 0px 0px 0.2rem; outline: none; }

.btn-submit { background-color: rgb(225, 0, 25); color: white; font-weight: 700; font-size: 1.1rem; padding: 16px 24px; border-radius: 4px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; width: 100%; margin-top: 35px; text-transform: uppercase; transition: background-color 0.2s, transform 0.1s; }

.btn-submit:hover { background-color: rgb(179, 0, 20); }

#successMessage { display: none; text-align: center; padding: 40px 20px; animation: 0.4s ease-out 0s 1 normal none running fadeIn; }

@keyframes fadeIn { 
  0% { opacity: 0; transform: translateY(10px); }
  100% { opacity: 1; transform: translateY(0px); }
}

#successMessage i { font-size: 4rem; color: rgb(225, 0, 25); margin-bottom: 20px; }

#successMessage h3 { font-weight: 800; color: rgb(26, 26, 26); margin-bottom: 15px; text-transform: uppercase; }

#successMessage p { color: rgb(71, 85, 105); font-size: 1.1rem; line-height: 1.6; }

.footer-note { text-align: center; color: rgb(136, 136, 136); font-size: 0.85rem; margin-top: 20px; }

@media (max-width: 768px) {
  .content-card { padding: 30px 20px; }
  h1 { font-size: 1.8rem; }
}</style>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invia una richiesta - Supporto</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-7">
            
            <div class="content-card">
                <h1>Invia una richiesta</h1>
                <p class="subtitle">Siamo qui per aiutarti. Compila il modulo sottostante.</p>
                
                <form id="fakeContactForm">
                    
                    <label for="email" class="form-label">Il tuo indirizzo e-mail *</label>
                    <input type="email" class="form-control" id="email" required="" placeholder="nome@esempio.it">

                    <label for="topic" class="form-label">Come possiamo aiutarti? *</label>
                    <select class="form-select" id="topic" required="">
                        <option value="" selected="" disabled="">Seleziona un argomento...</option>
                        <option value="account">Domande sull'account</option>
                        <option value="deposit">Depositi e Prelievi</option>
                        <option value="trading">Piattaforma di trading e strumenti</option>
                        <option value="technical">Supporto tecnico</option>
                        <option value="other">Altro</option>
                    </select>

                    <label for="subject" class="form-label">Oggetto *</label>
                    <input type="text" class="form-control" id="subject" required="">

                    <label for="description" class="form-label">Descrizione *</label>
                    <textarea class="form-control" id="description" rows="6" required="" placeholder="Inserisci i dettagli della tua richiesta..."></textarea>

                    <button type="submit" class="btn-submit">Invia</button>
                    
                </form>

                <div id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <h3>Richiesta inviata con successo!</h3>
                    <p>Grazie per il tuo messaggio. Il nostro team di supporto ti contatterà al più presto.</p>
                </div>
            </div>

            <div class="footer-note">
                © <span class="currentYear">2026</span> NAGA Markets Europe Ltd | Tutti i diritti riservati.
            </div>
            
        </div>
    </div>
</div>

<script>
    // Auto-update year in footer
    const yearElements = document.querySelectorAll('.currentYear');
    const currentYear = new Date().getFullYear();
    yearElements.forEach(el => el.textContent = currentYear);

    // JavaScript to handle the fake form submission
    document.getElementById('fakeContactForm').addEventListener('submit', function(event) {
        // Prevent the page from refreshing
        event.preventDefault();
        
        // Hide the form
        this.style.display = 'none';
        
        // Show the success message
        document.getElementById('successMessage').style.display = 'block';
        
        // Change the subtitle slightly to fit the success state
        document.querySelector('.subtitle').style.display = 'none';
    });
</script>
