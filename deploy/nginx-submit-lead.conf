# Add inside the existing `server { ... }` block for the site.

# REQUIRED: never serve .env / .git / other dotfiles or server-side code from the web root.
location ~ /\.(?!well-known) { deny all; return 404; }
location ^~ /server/ { deny all; return 404; }
location ^~ /deploy/ { deny all; return 404; }

location = /api/submit-lead {
    limit_except POST { deny all; }
    client_max_body_size 4k;

    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Real visitor IP when traffic comes through Cloudflare:
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 15s;
}
